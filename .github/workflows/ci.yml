name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: bash -n kagebox vm/*.sh host-gpu/*.sh bridge/*.sh tests/*.sh

      - name: Python syntax
        run: python3 -m py_compile bridge/gateway.py bridge/egress-warden.py evals/model_eval.py

      - name: Validate providers.json
        run: python3 -c "import json; json.load(open('bridge/providers.json'))"

      - name: Validate cloud-init YAML
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # pyyaml absent on runner; cloud-init is trivial YAML, skip
          yaml.safe_load(open('vm/cloud-init.yaml'))
          print("cloud-init.yaml OK")
          PY

      - name: Validate architecture SVG
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('docs/architecture.svg'); print('SVG OK')"

      - name: Bridge containment tests
        run: python3 tests/test_gateway.py

      - name: Setup posture reporting (never claim containment we did not observe)
        run: bash tests/test_setup_posture.sh

      - name: Egress allowlist parsing (an entry names a service, not an address)
        run: bash tests/test_egress_allowlist.sh

      - name: Warden scoping (guest can ask, never grant; no silent full-VM windows)
        run: python3 tests/test_warden_scope.py

      - name: Spend budgets (a compromised agent cannot spend without limit)
        run: python3 tests/test_budget.py

      - name: Adversarial invariants (attack the boundary, fail if one gives way)
        run: python3 tests/test_invariants.py

      - name: Egress profiles (a profile is a floor, never a ceiling)
        run: bash tests/test_egress_profiles.sh

      - name: Validate egress rulesets (nft syntax)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          # Syntax-check exactly what `egress-apply.sh on` would apply, so a
          # malformed rule is caught here rather than inside a VM at runtime —
          # where a failed load means the sandbox is silently uncontained.
          # Both with and without an IPv6 gateway present.
          for gw6 in "fe80::1" ""; do
            GW=10.0.0.1 GW6="$gw6" BRIDGE_PORT=18080 \
              bash vm/egress-apply.sh render | sudo nft -c -f -
          done
          echo "guest egress ruleset OK (v6 gateway present and absent)"

      - name: ShellCheck (informational)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning kagebox vm/*.sh host-gpu/*.sh
