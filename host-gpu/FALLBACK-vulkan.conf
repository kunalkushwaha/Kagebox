# === VULKAN FALLBACK (use ONLY if ROCm ever hangs again) ===
# Vulkan/RADV runs on the amdgpu graphics ring, NOT the KFD/MES compute path,
# so it structurally avoids the MES REMOVE_QUEUE -> MODE2 reset failure.
# Ollama prefers ROCm over Vulkan, so you MUST remove the HSA override so ROCm
# declines gfx1103 and only Vulkan is left to claim the iGPU.
#
# STEP 1 (human, sudo): disable the ROCm override so Vulkan wins
#   sudo rm /etc/systemd/system/ollama.service.d/override.conf
# STEP 2 (human, sudo): install THIS file as igpu.conf (replaces the ROCm igpu.conf)
#   sudo cp FALLBACK-vulkan.conf /etc/systemd/system/ollama.service.d/igpu.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# STEP 3: verify the log says library=Vulkan / RADV PHOENIX (NOT ROCm, NOT llvmpipe/lavapipe):
#   journalctl -u ollama -b | grep -iE 'vulkan|radv|library=|llvmpipe|lavapipe|offloaded'
# STEP 4 (only if it STILL logs library=ROCm): hard-disable the HIP backend, then restart:
#   sudo mv /usr/local/lib/ollama/rocm_v7_2/libggml-hip.so /usr/local/lib/ollama/rocm_v7_2/libggml-hip.so.disabled
#   (An Ollama auto-update restores this file; re-apply after updates.)
[Service]
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_VULKAN=1"
Environment="OLLAMA_GPU_OVERHEAD=1073741824"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Pin the real GPU and mask the lavapipe software rasterizer that is installed on this box:
Environment="GGML_VK_VISIBLE_DEVICES=0"
Environment="VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json"
