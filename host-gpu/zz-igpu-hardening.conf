[Service]
# Additive hardening for the 780M iGPU path. Does NOT touch the proven-good
# igpu.conf (IGPU_ENABLE=1 + GPU_OVERHEAD=1GiB) or override.conf (HSA 11.0.0).
# Fewer concurrent GPU consumers = fewer KFD/MES queue-eviction events, which
# is the exact mechanism behind the MES REMOVE_QUEUE -> MODE2 reset hang.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Pin the model resident. The MES->MODE2 reset is triggered by REMOVE_QUEUE,
# which Ollama issues every time a model is UNLOADED — including the default
# ~4-min idle keep-alive expiry. KEEP_ALIVE=-1 keeps hermes-ctx loaded so the
# GPU crosses that firmware path as rarely as possible (the single biggest
# residual trigger, per the adversarial safety review).
Environment="OLLAMA_KEEP_ALIVE=-1"
