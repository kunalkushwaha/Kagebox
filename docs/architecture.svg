<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0.5" y="0.5" width="899" height="475" rx="16" fill="#fcfdff" stroke="#e5e7eb"/>

  <!-- ============================ HOST ============================ -->
  <rect x="28" y="86" width="392" height="352" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <circle cx="52" cy="66" r="5" fill="#4f46e5"/>
  <text x="66" y="71" font-size="14" font-weight="700" fill="#3730a3" letter-spacing="1.5">YOUR HOST</text>

  <!-- Ollama -->
  <rect x="48" y="108" width="352" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="132" font-size="14" font-weight="600" fill="#0f172a">Ollama</text>
  <text x="130" y="132" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#4f46e5">:11434</text>
  <text x="66" y="150" font-size="11.5" fill="#64748b">local models · GPU / CPU</text>

  <!-- Bridge -->
  <rect x="48" y="176" width="352" height="242" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="66" y="200" font-size="14" font-weight="600" fill="#0f172a">Bridge gateway</text>
  <text x="66" y="218" font-size="11.5" fill="#64748b">runs as your user · binds VM-only IP · :18080</text>
  <line x1="66" y1="232" x2="382" y2="232" stroke="#eef2f7"/>
  <g font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="66" y="256" fill="#334155">/v1</text>
    <text x="210" y="256" fill="#94a3b8">→</text>
    <text x="234" y="256" fill="#475569">Ollama (local)</text>
    <text x="66" y="280" fill="#334155">/claude</text>
    <text x="210" y="280" fill="#94a3b8">→</text>
    <text x="234" y="280" fill="#475569">host claude -p</text>
    <text x="66" y="304" fill="#334155">/gemini /anthropic</text>
    <text x="210" y="304" fill="#94a3b8">→</text>
    <text x="234" y="304" fill="#475569">cloud APIs</text>
    <text x="66" y="328" fill="#334155">/openrouter …</text>
    <text x="210" y="328" fill="#94a3b8">→</text>
    <text x="234" y="328" fill="#475569">any OpenAI-compatible</text>
  </g>
  <rect x="66" y="350" width="316" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="82" y="371" font-size="12" font-weight="600" fill="#b45309">API keys injected here</text>
  <text x="82" y="389" font-size="11" fill="#92400e">host-side only — they never enter the VM</text>

  <!-- ============================ SANDBOX ============================ -->
  <rect x="480" y="86" width="392" height="352" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="504" cy="66" r="5" fill="#059669"/>
  <text x="518" y="71" font-size="14" font-weight="700" fill="#065f46" letter-spacing="1">SANDBOX · KVM microVM (own kernel)</text>

  <rect x="500" y="108" width="352" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="132" font-size="14" font-weight="600" fill="#0f172a">Hermes Agent</text>
  <text x="518" y="150" font-size="11.5" fill="#64748b">+ headless Chromium · tools · files · browser</text>

  <rect x="500" y="176" width="352" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="200" font-size="13.5" font-weight="600" fill="#0f172a">runs untrusted, autonomous work</text>
  <text x="518" y="219" font-size="11.5" fill="#64748b">can't touch your host FS, kernel, or LAN</text>

  <rect x="500" y="250" width="352" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="274" font-size="13" font-weight="600" fill="#0f172a">~/.hermes memory</text>
  <text x="518" y="293" font-size="11.5" fill="#64748b">snapshotted to host → survives a VM crash</text>

  <rect x="500" y="324" width="352" height="60" rx="9" fill="#ffffff" stroke="#10b981"/>
  <text x="518" y="348" font-size="13" font-weight="600" fill="#065f46">workspace/</text>
  <text x="518" y="367" font-size="11.5" fill="#64748b">the only folder shared with your host</text>

  <!-- ============================ BRIDGE LINK ============================ -->
  <line x1="410" y1="207" x2="490" y2="207" stroke="#d97706" stroke-width="3"/>
  <polygon points="490,207 481,202 481,212" fill="#d97706"/>
  <polygon points="410,207 419,202 419,212" fill="#d97706"/>
  <rect x="412" y="177" width="76" height="24" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="450" y="193" font-size="11" font-weight="600" text-anchor="middle" fill="#b45309">bridge</text>

  <!-- caption -->
  <text x="450" y="458" font-size="11.5" text-anchor="middle" fill="#64748b">The bridge is the only channel between host and sandbox — NAT by default, egress-allowlistable. Your keys never cross it.</text>
</svg>
